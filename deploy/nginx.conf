# nginx site for Gulzor. Replace gulzor.uz with your domain, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gulzor
#   sudo ln -s /etc/nginx/sites-available/gulzor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gulzor.uz -d www.gulzor.uz     # free TLS certificate (Let's Encrypt)

server {
    listen 80;
    server_name gulzor.uz www.gulzor.uz;
    # certbot replaces this block with an HTTPS redirect.
    location / { proxy_pass http://127.0.0.1:3000; }
}

server {
    # certbot adds: listen 443 ssl; ssl_certificate …; ssl_certificate_key …;
    server_name gulzor.uz;

    # Product photo uploads go through Server Actions (limit in next.config.ts is 8 MB).
    client_max_body_size 8m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Real client IP — used for rate limiting (login, checkout, forms).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Let streamed pages (loading skeletons) reach the browser immediately.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

# Optional: send www to the main domain.
server {
    server_name www.gulzor.uz;
    return 301 https://gulzor.uz$request_uri;
}
